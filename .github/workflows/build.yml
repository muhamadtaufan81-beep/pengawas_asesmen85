name: Build Aplikasi Pengawas

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  FLUTTER_CHANNEL: stable
  CREATE_ARGS: --org id.sch.sman85jkt --project-name pengawas_asesmen85
  BUILD_FLAGS: --release --obfuscate --split-debug-info=build/debug-info

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Buat folder platform Android
        run: flutter create $CREATE_ARGS --platforms=android .

      - name: Pasang MainActivity (blokir screenshot) dan izin internet
        run: |
          set -e
          ACT=$(find android/app/src/main -name MainActivity.kt -o -name MainActivity.java | head -n 1)
          if [ -z "$ACT" ]; then
            echo "MainActivity tidak ditemukan"; exit 1
          fi
          case "$ACT" in
            *.kt)
              PKG_LINE=$(grep -m1 '^package ' "$ACT")
              cp platform_setup/android/MainActivity.kt "$ACT"
              sed -i "1s|^package .*|$PKG_LINE|" "$ACT"
              ;;
            *)
              echo "MainActivity berbentuk Java, hapus lalu pakai versi Kotlin"
              DIR=$(dirname "$ACT")
              PKG_LINE=$(grep -m1 '^package ' "$ACT")
              rm "$ACT"
              mkdir -p "$DIR"
              ACT="$DIR/MainActivity.kt"
              cp platform_setup/android/MainActivity.kt "$ACT"
              sed -i "1s|^package .*|$PKG_LINE|" "$ACT"
              ;;
          esac
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"
          fi
          head -n 3 "$ACT"
          grep -n INTERNET "$MANIFEST"

      - run: flutter pub get

      - name: Pasang ikon aplikasi Android
        run: |
          set -e
          test -f platform_setup/icon.png || { echo "File platform_setup/icon.png tidak ditemukan"; exit 1; }
          flutter pub add --dev flutter_launcher_icons
          printf '%s\n' 'flutter_launcher_icons:' '  image_path: "platform_setup/icon.png"' '  android: true' '  ios: false' > flutter_launcher_icons.yaml
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Perbaiki plugin Android (proguard tidak lagi didukung Gradle baru)
        run: |
          set -e
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"
          FILES=$(grep -rl --include='build.gradle*' 'proguard-android.txt' "$CACHE" 2>/dev/null || true)
          for f in $FILES; do
            echo "Memperbaiki: $f"
            sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f"
          done

      - name: Izinkan trafik http dan matikan shrink agar WebView stabil di semua perangkat
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
          grep -n 'usesCleartextTraffic' "$MANIFEST"

      # APK universal: satu file untuk semua tipe Android
      # (ARM 32-bit, ARM 64-bit, dan x86_64/emulator)
      - name: Build APK universal (semua arsitektur)
        run: >
          flutter build apk $BUILD_FLAGS --no-shrink
          --target-platform android-arm,android-arm64,android-x64

      - name: Simpan APK universal
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/pengawas-universal.apk

      # APK terpisah per arsitektur (ukuran lebih kecil)
      - name: Build APK per arsitektur
        run: >
          flutter build apk $BUILD_FLAGS --no-shrink --split-per-abi

      - name: Kumpulkan APK per arsitektur
        run: |
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/pengawas-arm32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/pengawas-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/pengawas-x86_64.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pengawas-android-apk
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Buat folder platform Windows
        run: flutter create $CREATE_ARGS --platforms=windows .

      - name: Izinkan coroutine lama untuk plugin WebView (kompiler MSVC baru menolaknya)
        run: |
          set -e
          sed -i '/^project(/a add_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' windows/CMakeLists.txt
          grep -n -B1 'SILENCE_EXPERIMENTAL' windows/CMakeLists.txt

      - run: flutter pub get

      - name: Pasang ikon aplikasi Windows
        run: |
          set -e
          test -f platform_setup/icon.png || { echo "File platform_setup/icon.png tidak ditemukan"; exit 1; }
          flutter pub add --dev flutter_launcher_icons
          printf '%s\n' 'flutter_launcher_icons:' '  image_path: "platform_setup/icon.png"' '  android: false' '  ios: false' '  windows:' '    generate: true' '    image_path: "platform_setup/icon.png"' '    icon_size: 256' > flutter_launcher_icons.yaml
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build Windows
        run: flutter build windows $BUILD_FLAGS

      - uses: actions/upload-artifact@v4
        with:
          name: pengawas-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Buat folder platform macOS
        run: flutter create $CREATE_ARGS --platforms=macos .

      - name: Izin jaringan dan versi minimum macOS
        run: |
          set -e
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if 'com.apple.security.network.client' not in s:
              add = '<key>com.apple.security.network.client</key>\n<true/>\n'
              i = s.rindex('</dict>')
              s = s[:i] + add + s[i:]
              open(p, 'w').write(s)
          PY
            grep -n 'network.client' "$f"
          done
          sed -i.bak -E "s/^platform :osx.*/platform :osx, '10.15'/" macos/Podfile
          sed -i.bak -E "s/MACOSX_DEPLOYMENT_TARGET = [0-9.]+;/MACOSX_DEPLOYMENT_TARGET = 10.15;/" macos/Runner.xcodeproj/project.pbxproj
          grep -n "platform :osx" macos/Podfile

      - run: flutter pub get

      - name: Pasang ikon aplikasi macOS
        run: |
          set -e
          test -f platform_setup/icon.png || { echo "File platform_setup/icon.png tidak ditemukan"; exit 1; }
          flutter pub add --dev flutter_launcher_icons
          printf '%s\n' 'flutter_launcher_icons:' '  image_path: "platform_setup/icon.png"' '  android: false' '  ios: false' '  macos:' '    generate: true' '    image_path: "platform_setup/icon.png"' > flutter_launcher_icons.yaml
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build macOS
        run: flutter build macos $BUILD_FLAGS

      - name: Kemas aplikasi macOS
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/pengawas-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pengawas-macos
          path: pengawas-macos.zip
          if-no-files-found: error
