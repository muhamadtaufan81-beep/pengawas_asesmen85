name: Build Aplikasi Pengawas

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  FLUTTER_CHANNEL: stable
  CREATE_ARGS: --org id.sch.sman85jkt --project-name pengawas_asesmen85
  BUILD_FLAGS: --release --obfuscate --split-debug-info=build/debug-info

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Buat folder platform Android
        run: flutter create $CREATE_ARGS --platforms=android .

      - name: Pasang MainActivity (blokir screenshot) dan izin internet
        run: |
          set -e
          ACT=$(find android/app/src/main/kotlin -name MainActivity.kt | head -n 1)
          PKG_LINE=$(grep -m1 '^package ' "$ACT")
          cp platform_setup/android/MainActivity.kt "$ACT"
          sed -i "1s|^package .*|$PKG_LINE|" "$ACT"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"
          fi
          head -n 3 "$ACT"
          grep -n INTERNET "$MANIFEST"

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk $BUILD_FLAGS

      - uses: actions/upload-artifact@v4
        with:
          name: pengawas-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Buat folder platform Windows
        run: flutter create $CREATE_ARGS --platforms=windows .

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows $BUILD_FLAGS

      - uses: actions/upload-artifact@v4
        with:
          name: pengawas-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Buat folder platform macOS
        run: flutter create $CREATE_ARGS --platforms=macos .

      - name: Izin jaringan dan versi minimum macOS
        run: |
          set -e
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if 'com.apple.security.network.client' not in s:
              add = '<key>com.apple.security.network.client</key>\n<true/>\n'
              i = s.rindex('</dict>')
              s = s[:i] + add + s[i:]
              open(p, 'w').write(s)
          PY
            grep -n 'network.client' "$f"
          done
          sed -i.bak -E "s/^platform :osx.*/platform :osx, '10.15'/" macos/Podfile
          sed -i.bak -E "s/MACOSX_DEPLOYMENT_TARGET = [0-9.]+;/MACOSX_DEPLOYMENT_TARGET = 10.15;/" macos/Runner.xcodeproj/project.pbxproj
          grep -n "platform :osx" macos/Podfile

      - run: flutter pub get

      - name: Build macOS
        run: flutter build macos $BUILD_FLAGS

      - name: Kemas aplikasi macOS
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/pengawas-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: pengawas-macos
          path: pengawas-macos.zip
          if-no-files-found: error
